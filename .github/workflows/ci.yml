name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ris
        run: |
          curl -fsSL https://raw.githubusercontent.com/rislang/ris/main/install_ris.sh | RIS_PREFIX="$HOME/.local" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: ris version

      - name: Test
        run: ./check.sh

      - name: Build the examples
        run: |
          export IYI_PATH="$PWD:$(ris env IYI_PATH)"
          for example in examples/*.ri; do
            case "$example" in *_test.ri) continue ;; esac
            echo "building $example"
            ris build "$example" -o "$RUNNER_TEMP/example"
          done

  # What the next tag has to be called, from what the exported surface did
  # since the last one: an export gone is a new minor before v1 and a new
  # major after, and a pull request that makes one says so here.
  surface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags, which the surface is compared against.
          fetch-depth: 0

      - name: Install ris
        run: |
          curl -fsSL https://raw.githubusercontent.com/rislang/ris/main/install_ris.sh | RIS_PREFIX="$HOME/.local" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: What the next release has to be
        run: ris mod release
